#
#  project.yml — XcodeGen project specification
#  ─────────────────────────────────────────────
#  This repository does not commit a .xcodeproj. The project is generated from
#  this file, which means:
#
#    * no machine-specific absolute paths in version control
#    * a merge-conflict-free project file
#    * the build is fully reproducible on a GitHub-hosted macOS runner with
#      nothing installed except Xcode and XcodeGen
#
#  Locally (on a Mac):   brew install xcodegen && xcodegen generate
#  In CI:                see .github/workflows/build-ipa.yml
#
#  To point the app at your own bundle identifier (important for free Apple ID
#  signing, because the App ID has to be unique across all of Apple's teams),
#  override BUNDLE_ID_BASE — either edit it here or pass it to xcodebuild:
#
#      xcodebuild ... BUNDLE_ID_BASE=com.yourname.proxytunnel
#
name: ProxyTunnel

options:
  bundleIdPrefix: io.github.kylosonic
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  defaultConfig: Debug
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.35.0"

attributes:
  ORGANIZATIONNAME: ProxyTunnel
  LastUpgradeCheck: "1600"

configs:
  Debug: debug
  Release: release

settings:
  base:
    # ── Identity ────────────────────────────────────────────────────────────
    # The single knob you are most likely to need to change. It must be a
    # reverse-DNS string that nobody else has registered as an App ID, because
    # free Apple ID signing registers App IDs globally.
    BUNDLE_ID_BASE: io.github.kylosonic.proxytunnel
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

    # ── Language / SDK ──────────────────────────────────────────────────────
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_EMIT_LOC_STRINGS: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

    # ── Warnings ────────────────────────────────────────────────────────────
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

    # ── Code signing ────────────────────────────────────────────────────────
    # Left deliberately empty. The unsigned CI build passes
    # CODE_SIGNING_ALLOWED=NO on the command line, and a developer with a paid
    # account picks their own team in Xcode. Nothing about signing — and above
    # all no certificate or profile — is committed to this repository.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    CODE_SIGN_IDENTITY: "Apple Development"

    # ── Packaging ───────────────────────────────────────────────────────────
    ENABLE_BITCODE: NO
    DEAD_CODE_STRIPPING: YES
    COPY_PHASE_STRIP: NO
    STRIP_INSTALLED_PRODUCT: NO
    SKIP_INSTALL: NO
    VALIDATE_PRODUCT: NO

  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_OPTIMIZATION_LEVEL: "0"
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
      DEBUG_INFORMATION_FORMAT: dwarf
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      ENABLE_TESTABILITY: NO
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages:
  # Local Swift package holding every line of logic that is not UI:
  # the proxy clients, the TCP/IP stack, the tunnel engine, validation,
  # Keychain access and diagnostics.
  #
  # It is a *static* library product, so both the app and the extension link
  # their own copy into their own Mach-O image. That matters when the IPA is
  # later re-signed by a third-party tool: there is no embedded framework to
  # re-sign, and therefore nothing to get wrong.
  ProxyTunnelCore:
    path: Packages/ProxyTunnelCore

targets:

  # ─────────────────────────────────────────────────────────────────────────
  #  Main application
  # ─────────────────────────────────────────────────────────────────────────
  ProxyTunnel:
    type: application
    platform: iOS
    sources:
      - path: Sources/ProxyTunnelApp
    settings:
      base:
        PRODUCT_NAME: ProxyTunnel
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE)
        INFOPLIST_FILE: Config/ProxyTunnel-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/ProxyTunnel.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_PRECOMPILE_BRIDGING_HEADER: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - package: ProxyTunnelCore
        product: ProxyTunnelCore
      - target: ProxyTunnelExtension
        embed: true
        codeSign: true
      - sdk: NetworkExtension.framework
      - sdk: Network.framework
      - sdk: Security.framework

  # ─────────────────────────────────────────────────────────────────────────
  #  Network Extension — Packet Tunnel Provider
  # ─────────────────────────────────────────────────────────────────────────
  ProxyTunnelExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/ProxyTunnelExtension
    settings:
      base:
        PRODUCT_NAME: ProxyTunnelExtension
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).tunnel
        INFOPLIST_FILE: Config/ProxyTunnelExtension-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/ProxyTunnelExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        # Extensions are loaded by the system, not launched, so they must not
        # carry an LC_MAIN-based entry point dependency on the host app.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - package: ProxyTunnelCore
        product: ProxyTunnelCore
      - sdk: NetworkExtension.framework
      - sdk: Network.framework
      - sdk: Security.framework

  # ─────────────────────────────────────────────────────────────────────────
  #  Unit tests
  #
  #  Host-less: the tests exercise ProxyTunnelCore, which is where all of the
  #  logic lives. Keeping them host-less means no app launch, no VPN consent
  #  prompt and a much faster run on the CI machine.
  # ─────────────────────────────────────────────────────────────────────────
  ProxyTunnelCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ProxyTunnelCoreTests
    settings:
      base:
        PRODUCT_NAME: ProxyTunnelCoreTests
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    dependencies:
      - package: ProxyTunnelCore
        product: ProxyTunnelCore
      - sdk: Network.framework

schemes:

  ProxyTunnel:
    build:
      targets:
        ProxyTunnel: all
        ProxyTunnelExtension: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ProxyTunnelCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # A scheme that builds only the extension, so a failure there is easy to
  # isolate in CI.
  ProxyTunnelExtension:
    build:
      targets:
        ProxyTunnelExtension: all
    run:
      config: Debug
    archive:
      config: Release

  ProxyTunnelCoreTests:
    build:
      targets:
        ProxyTunnelCoreTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ProxyTunnelCoreTests
