# ---------------------------------------------------------------------------
#  Gradle properties.
#
#  `android.useAndroidX` is required, and the JVM args are the ones AGP 8.x
#  documents: without them a cold CI build runs out of metaspace.
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
